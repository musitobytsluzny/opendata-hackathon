map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Empty keys are not rate-limited. Match normalized paths before/after /api rewrite.
map "$request_method:$uri" $auth_limit_key {
    default "";
    ~^POST:(/api)?/(auth/login|users/)$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_requests:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /api { return 308 /api/; }
    location /api/ {
        client_max_body_size 256k;
        limit_req zone=auth_requests burst=10 nodelay;
        limit_req_status 429;
        proxy_read_timeout 90s;
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp { return 308 /mcp/; }
    location /mcp/ {
        set $mcp_upstream mcp:8000;
        proxy_pass http://$mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        set $web_upstream web:5173;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
