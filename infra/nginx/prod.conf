map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map "$request_method:$uri" $auth_limit_key {
    default "";
    ~^POST:(/api)?/(auth/login|users/)$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_requests:10m rate=20r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location = /api { return 308 /api/; }
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }
    location /api/ {
        limit_req zone=auth_requests burst=10 nodelay;
        limit_req_status 429;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /mcp { return 404; }
    location ^~ /mcp/ { return 404; }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.mjs$ {
        default_type application/javascript;
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
