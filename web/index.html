    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d120e;
      }
      #root {
        height: 100%;
      }
      .loader {
        min-height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        color: rgba(255, 255, 255, 0.74);
        font:
          500 14px/1.4 'Onest Variable',
          system-ui,
          sans-serif;
        animation: loader-in 0.6s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .loader svg {
        width: 96px;
        height: auto;
        overflow: visible;
        fill: none;
        stroke: #fff;
        stroke-width: 1.4;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .loader__track {
        opacity: 0.2;
      }
      .loader__run {
        stroke-dasharray: 0.28 0.72;
        animation: loader-run 2.2s linear infinite;
      }
      @keyframes loader-in {
        from {
          opacity: 0;
          filter: blur(8px);
        }
      }
      @keyframes loader-run {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader__track {
          opacity: 0.7;
        }
        .loader__run {
          display: none;
        }
      }
      [data-motion='reduce'] .loader__track {
        opacity: 0.7;
      }
      [data-motion='reduce'] .loader__run {
        display: none;
      }
    </style>
