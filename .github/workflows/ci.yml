name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run format:check --prefix web
      - run: npm run build --prefix web
      - run: docker compose --env-file .env.example -f infra/compose.dev.yml config --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make up
      - run: make smoke
      - run: make test-api
      - if: failure()
        run: docker compose logs --no-color --tail 150
      - if: always()
        run: make down
